<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productivity Dashboard</title>
    <link rel="stylesheet" href="style.css" class="css">
</head>
<body>
    <div id="main">
        <section class ="allelements">
            <div class="todo elem" id="0">
                <img src="https://plus.unsplash.com/premium_photo-1681487870238-4a2dfddc6bcb?q=80&w=880&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D
                " alt="">
                <h2>To Do List</h2>
            </div>
            <div class="daily elem" id="1">
                <img src="https://plus.unsplash.com/premium_photo-1706559780094-648dbe2b2bd0?w=400&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D
                " alt="">
                <h2>Daily Planner</h2>
            </div>
            <div class="moti elem" id="2">
                <img src="https://media.istockphoto.com/id/2170399214/photo/geometric-composition-with-sphere-sharp-shadows-light-background-vibrant-colors-high-contrast.webp?a=1&b=1&s=612x612&w=0&k=20&c=_O3qgmpUYodDFmM9yG6WlBimDFQbIJAK5q_FK1P0yHA=
                " alt="">
                <h2>Motivation</h2>
            </div>
            <div class="pomo elem" id="3">
                <img src="https://media.istockphoto.com/id/1167798559/photo/tomato-character-with-speed-meter.webp?a=1&b=1&s=612x612&w=0&k=20&c=kMapSaLYR9scHJdVMKUS4UAqrlmTwakMXuOvDoaNeqM=
                " alt="">
                <h2>Pomodoro Timer</h2>
            </div>
            <div class="goals elem" id="4">
                <img src="https://images.unsplash.com/photo-1667753945977-f53f9a141d6d?w=294&dpr=2&h=294&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=NHwxMjA3fDA%3D
                " alt="">
                <h2>Daily Goals</h2>
            </div>

        </section>
        <section class="fullElem todo-list-fullpage">
            <button class="back"id="0">Back</button>
            <h2>Your Personalized Task List</h2>
            <div class="todo-container">
                <div class="addTask">
                    <form>
                        <input type="text" placeholder="Add a new task...">
                        <textarea placeholder="Enter Details..." name="" id="" cols="30" rows="10" ></textarea>
                        <div class="mark-imp"> 
                            <input type="checkbox" name="" id="check">
                            <label for="check">Mark as important</label>
                        </div>
                        <button type="submit">Add Task</button>
                    </form>
                </div>
                <div class="allTask">
                    

                </div>
            </div>
        </section>
        <section class="fullElem daily-planner-fullpage">
            <button class="back" id="1">Back</button>
            <h1>Daily Planner</h1>
        </section>
        <section class="fullElem motivation-fullpage">
            <button class="back" id="2">Back</button>
            <h1>Motivation</h1>
        </section>
        <section class="fullElem pomodoro-timer-fullpage">
            <button class="back" id="3">Back</button>
            <h1>Pomodoro Timer</h1>
        </section>
        <section class="fullElem daily-goals-fullpage">
            <button class="back" id="4">Back</button>
            <h1>Daily Goals</h1>
        </section>
     
    </div>
    <script src="script.js"></script>
</body>
</html>
